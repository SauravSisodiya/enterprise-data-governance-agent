# Visual theme only - no behavioural settings here.
#
# Dark teal palette. base="dark" plus custom colors, rather than relying on
# Streamlit's built-in dark theme, so the sidebar/dataframe/code-block
# colors (secondaryBackgroundColor) stay in the same teal family as the
# accent color instead of Streamlit's default grey. The four risk-band
# badge colors (Critical/High/Medium/Low, see BAND_COLOUR in app.py) are
# deliberately NOT part of this palette - they carry real meaning
# (severity) and stay as solid, high-contrast badges regardless of theme.
[theme]
base = "dark"
primaryColor = "#2E97A6"
backgroundColor = "#0B1B1E"
secondaryBackgroundColor = "#132E33"
textColor = "#E4F3F2"
font = "sans serif"